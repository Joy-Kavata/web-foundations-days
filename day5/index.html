<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <link rel="stylesheet" href="../style.css"> <!-- Optional stylesheet link if you want global styles, or inline styles -->
    <script src="users.js" defer></script>
</head>
<body>
    <header>
        <h1>User Directory</h1>
    </header>

    <main class="container">
        <section class="card">
            <button id="load-users">Load Users</button>
            
            <div class="form-group" style="margin-top: 1rem;">
                <label for="filter-input">Filter users by name:</label>
                <input type="text" id="filter-input" placeholder="Type to filter...">
            </div>

            <p id="status">Click the button to load users.</p>
            <ul id="users-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Web Foundations</p>
    </footer>
</body>
</html>
