<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Day 4</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>QuickNotes Editor</h1>
        
        <div class="editor-group">
            <label for="note-text">Write your note:</label>
            <textarea id="note-text" placeholder="Type your note here..."></textarea>
            
            <div class="counters">
                <p id="char-count">0 / 200 characters</p>
                <p id="word-count">0 words</p>
            </div>
        </div>

        <div class="button-group">
            <button id="clear-btn">Clear</button>
            <button id="theme-toggle">Dark mode</button>
        </div>
    </main>
</body>
</html>
